services:
  garmin-mcp:
    build: .
    image: garmin-mcp:latest
    container_name: garmin-mcp
    restart: unless-stopped
    env_file: .env
    volumes:
      # garth session tokens, generated locally (see README). Read-only.
      - ./tokens:/tokens:ro
    healthcheck:
      # No curl/wget in the slim image, so probe with Python. Hit the OAuth
      # metadata endpoint, which returns 200 without auth — this proves the app
      # is serving (not just uvicorn) and avoids the noisy 401 "Auth error" log
      # lines that probing /mcp/ would produce. A refused connection counts as
      # unhealthy.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,urllib.error,sys;\ntry: urllib.request.urlopen('http://127.0.0.1:8000/.well-known/oauth-authorization-server', timeout=5)\nexcept urllib.error.HTTPError: pass\nexcept Exception: sys.exit(1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.garmin-mcp.rule=Host(`${GARMIN_MCP_DOMAIN}`)"
      - "traefik.http.routers.garmin-mcp.entrypoints=websecure"
      - "traefik.http.routers.garmin-mcp.tls=true"
      - "traefik.http.routers.garmin-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.garmin-mcp.loadbalancer.server.port=8000"

networks:
  # The external network your existing Traefik instance is attached to.
  # Adjust the name to match your setup (often `proxy`, `web`, or `traefik`).
  proxy:
    external: true
