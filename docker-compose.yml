services:
  garmin-mcp:
    build: .
    image: garmin-mcp:latest
    container_name: garmin-mcp
    restart: unless-stopped
    env_file: .env
    healthcheck:
      # No curl/wget in the slim image, so probe the dedicated /health route
      # with Python. It returns 200 without auth, so the logs stay clean. A
      # non-2xx response or a refused connection counts as unhealthy.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys;\nsys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.garmin-mcp.rule=Host(`${GARMIN_MCP_DOMAIN}`)"
      - "traefik.http.routers.garmin-mcp.entrypoints=websecure"
      - "traefik.http.routers.garmin-mcp.tls=true"
      - "traefik.http.routers.garmin-mcp.tls.certresolver=letsencrypt"
      - "traefik.http.services.garmin-mcp.loadbalancer.server.port=8000"

networks:
  # The external network your existing Traefik instance is attached to.
  # Adjust the name to match your setup (often `proxy`, `web`, or `traefik`).
  proxy:
    external: true
